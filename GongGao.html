<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公告</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #24292f;
    --muted: #57606a;
    --border: #d0d7de;
    --accent: #0969da;
    --info-bg: #ddf4ff;
    --info-border: #0969da;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2rem 1rem;
    background: #f6f8fa;
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC",
                 Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.75;
  }


  h1 {
    margin: 0 0 1.25rem;
    padding-bottom: .5rem;
    font-size: 1.9rem;
    line-height: 1.3;
    border-bottom: 1px solid var(--border);
  }

  h2 {
    margin: 0 0 1rem;
    font-size: 1.4rem;
    line-height: 1.4;
  }

  p { margin: .6rem 0; }

  strong { font-weight: 700; }

  .mention {
    display: inline-block;
    margin: .25rem 0 .5rem;
    padding: .15rem .55rem;
    font-weight: 700;
    color: #cf222e;
    background: #ffebe9;
    border-radius: 6px;
  }

  /* Wiki.js 风格提示块 */
  .is-info {
    margin: 1rem 0 1.25rem;
    padding: .7rem 1rem;
    background: var(--info-bg);
    border-left: 4px solid var(--info-border);
    border-radius: 4px;
    color: #0a3069;
  }

  .is-info p { margin: .25rem 0; }

  hr {
    margin: 2rem 0;
    border: 0;
    border-top: 1px solid var(--border);
  }

  footer {
    margin-top: 2.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: .875rem;
  }

  @media (max-width: 600px) {
    body { padding: 0; font-size: 15px; }
    article { padding: 1.25rem 1rem; border: none; border-radius: 0; }
  }
</style>
</head>
<body>
<article>

  <h1>公告</h1>

  <h2>永久性(第三次)玩家数迁移</h2>

  <p>@全体成员</p>

  <p>由于前段时间服务器更换了账号验证方式，玩家的数据也需要迁移。</p>

  <p>从现在起(2026/9/5)，需要迁移的数据玩家请直接私信管理员，但是完成数据迁移的时间将不在保证在较短时间内，最长为一个月，管理员也会尽快完成迁移。</p>

  <br>

  <p>所以：</p>

  <div class="is-info">
    <p>要迁移玩家数据的朋友们请私信我（或2BTB服务器管理员），告诉我您的<strong>皮肤站角色名+uuid</strong> 或 <strong>正版玩家名</strong>。</p>
  </div>

  <div class="is-info">
    <p>此通知一般情况下<strong>没有截止日期</strong>。</p>
  </div>

  <footer>© 2btb.top · 公告</footer>

</article>
</body>
</html>
