<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公告</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #24292f;
    --muted: #57606a;
    --border: #d0d7de;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2rem 1rem;
    background: #f6f8fa;
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC",
                 Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.75;
  }


  h1 {
    margin: 0 0 1.25rem;
    padding-bottom: .5rem;
    font-size: 1.9rem;
    line-height: 1.3;
    border-bottom: 1px solid var(--border);
  }

  ol {
    margin: .5rem 0;
    padding-left: 1.9rem;
  }

  li { margin: .4rem 0; }

  footer {
    margin-top: 2.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: .875rem;
  }

  @media (max-width: 600px) {
    body { padding: 0; font-size: 15px; }
    article { padding: 1.25rem 1rem; border: none; border-radius: 0; }
  }
</style>
</head>
<body>
<article>

  <h1>2026/7/19</h1>

  <ol>
    <li>游戏服务器遭受目的性ddos攻击，已成功阻拦。这是开服两年来最大的一次攻击，总共受到了400GB左右的攻击。</li>
  </ol>

  <footer>© 2btb.top · 服务器日志</footer>

</article>
</body>
</html>
